# EasyPanel / producción — NO publicar puertos en el host.
# EasyPanel enruta el tráfico vía Traefik al puerto interno del contenedor.
# MySQL vive fuera de este compose (servicio EasyPanel o host remoto).
# Para probar en local con localhost:8080 (front) / :4000 (back):
# docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# En EasyPanel asigna:
#   front → dominio del portal (puerto 80)
#   back  → dominio de la API  (puerto 4000)
# VITE_API_URL se hornea en el build del front: hay que reconstruir si cambia.

services:
  back:
    build: ./back
    expose:
      - "4000"
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://backoffice.intelekia.cloud}
      FRONTEND_URL: ${FRONTEND_URL:-https://backoffice.intelekia.cloud}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-portal_admin_intk}
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FINANCE_UPLOAD_DIR: ${FINANCE_UPLOAD_DIR:-/app/uploads/finance}
    volumes:
      - finance_uploads:/app/uploads

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - back
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 80

volumes:
  finance_uploads:
